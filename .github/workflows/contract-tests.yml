name: Contract tests

# Checks the spec against the live API. Runs weekly to catch changes to the
# API itself, and when the spec, tests, or tooling change.
on:
  schedule:
    - cron: "0 14 * * 1"
  push:
    branches: [main]
    paths: &paths
      - packages/spec/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/contract-tests.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One test job per API, so a failure points at the API that changed.
  apis:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: echo "hosts=$(ls packages/spec/apis | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  test:
    needs: apis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.apis.outputs.hosts) }}
    name: test (${{ matrix.host }})
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec node scripts/test.ts apis/${{ matrix.host }}/tests.arazzo.yaml
        working-directory: packages/spec
        env:
          SCOUTING_USERNAME: ${{ secrets.SCOUTING_USERNAME }}
          SCOUTING_PASSWORD: ${{ secrets.SCOUTING_PASSWORD }}
