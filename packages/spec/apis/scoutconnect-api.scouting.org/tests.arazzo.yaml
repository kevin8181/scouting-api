arazzo: 1.1.0
info:
  title: ScoutConnect API contract tests
  version: 0.1.0
sourceDescriptions:
  - name: api
    type: openapi
    url: ./openapi.yaml
workflows:
  - workflowId: councils
    steps:
      - stepId: list
        operationId: $sourceDescriptions.api.listCouncils
        parameters:
          - name: zipCode
            in: query
            value: "55345"
        successCriteria:
          - condition: $statusCode == 200
      - stepId: list-invalid-zip-code
        operationId: $sourceDescriptions.api.listCouncils
        parameters:
          - name: zipCode
            in: query
            value: abcde
        successCriteria:
          - condition: $statusCode == 400

  - workflowId: organizations
    steps:
      - stepId: get
        operationId: $sourceDescriptions.api.getOrganization
        parameters:
          - name: organizationId
            in: path
            value: 2cb46226-b47b-4ef1-ab3e-51806fe91dfd
        successCriteria:
          - condition: $statusCode == 200
      - stepId: get-not-found
        operationId: $sourceDescriptions.api.getOrganization
        parameters:
          - name: organizationId
            in: path
            value: 2cb46226-b47b-4ef1-ab3e-51806fe91dfe
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: zip-code-coordinates
    steps:
      - stepId: coordinates
        operationId: $sourceDescriptions.api.getZipCodeCoordinates
        parameters:
          - name: zipCode
            in: path
            value: "55345"
        successCriteria:
          - condition: $statusCode == 200
      - stepId: coordinates-invalid
        operationId: $sourceDescriptions.api.getZipCodeCoordinates
        parameters:
          - name: zipCode
            in: path
            value: abcde
        successCriteria:
          - condition: $statusCode == 400
      - stepId: coordinates-not-found
        operationId: $sourceDescriptions.api.getZipCodeCoordinates
        parameters:
          - name: zipCode
            in: path
            value: "99999"
        successCriteria:
          - condition: $statusCode == 404
