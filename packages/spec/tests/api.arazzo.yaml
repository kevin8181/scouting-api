arazzo: 1.1.0
info:
  title: Scouting America API contract tests
  version: 0.1.0
sourceDescriptions:
  - name: api
    type: openapi
    url: ../openapi.yaml
workflows:
  # Steps on cached list endpoints send no-cache. See the CacheControl parameter.
  - workflowId: merit-badges
    steps:
      - stepId: list
        operationId: $sourceDescriptions.api.listMeritBadges
        parameters:
          - name: Cache-Control
            in: header
            value: no-cache
        successCriteria:
          - condition: $statusCode == 200
      - stepId: list-invalid-status
        operationId: $sourceDescriptions.api.listMeritBadges
        parameters:
          - name: Cache-Control
            in: header
            value: no-cache
          - name: status
            in: query
            value: bogus
        successCriteria:
          - condition: $statusCode == 400
      - stepId: requirements
        operationId: $sourceDescriptions.api.getMeritBadgeRequirements
        parameters:
          - name: meritBadgeId
            in: path
            value: 3
        successCriteria:
          - condition: $statusCode == 200
      - stepId: requirements-not-found
        operationId: $sourceDescriptions.api.getMeritBadgeRequirements
        parameters:
          - name: meritBadgeId
            in: path
            value: 999999
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: ranks
    steps:
      - stepId: list
        operationId: $sourceDescriptions.api.listRanks
        parameters:
          - name: Cache-Control
            in: header
            value: no-cache
        successCriteria:
          - condition: $statusCode == 200
      - stepId: invalid-status
        operationId: $sourceDescriptions.api.listRanks
        parameters:
          - name: Cache-Control
            in: header
            value: no-cache
          - name: status
            in: query
            value: bogus
        successCriteria:
          - condition: $statusCode == 400
      - stepId: requirements
        operationId: $sourceDescriptions.api.getRankRequirements
        parameters:
          - name: rankId
            in: path
            value: 1
        successCriteria:
          - condition: $statusCode == 200
      - stepId: requirements-invalid
        operationId: $sourceDescriptions.api.getRankRequirements
        parameters:
          - name: rankId
            in: path
            value: 0
        successCriteria:
          - condition: $statusCode == 400
      - stepId: requirements-not-found
        operationId: $sourceDescriptions.api.getRankRequirements
        parameters:
          - name: rankId
            in: path
            value: 999999
        successCriteria:
          - condition: $statusCode == 404
