# Same rules as `recommended`, but every warning is an error.
extends:
  - recommended-strict

# Enable rules that are off by default
rules:
  component-name-unique: error
  info-contact: error
  no-example-value-and-externalValue: error
  operation-description: error
  operation-singular-tag: error
  operation-tag-defined: error
  parameter-description: error
  spec-strict-refs: error
  tags-alphabetical: error

  # Every object schema must reject unknown fields, so the contract tests catch
  # fields the API adds that the spec doesn't describe yet.
  rule/object-schemas-closed:
    subject:
      type: Schema
      property: additionalProperties
    where:
      - subject:
          type: Schema
          property: type
        assertions:
          const: object
    assertions:
      defined: true
      const: false
    message: "Object schemas must set `additionalProperties: false`."

# Two entries per API, named by its host: the spec, and its contract tests.
# The tests get their own entry so they lint under the API config too.
# Otherwise Redocly reports the OpenAPI rules above as unused.
apis:
  api.scouting.org:
    root: apis/api.scouting.org/openapi.yaml
  api.scouting.org-tests:
    root: apis/api.scouting.org/tests.arazzo.yaml
  scoutconnect-api.scouting.org:
    root: apis/scoutconnect-api.scouting.org/openapi.yaml
  scoutconnect-api.scouting.org-tests:
    root: apis/scoutconnect-api.scouting.org/tests.arazzo.yaml
